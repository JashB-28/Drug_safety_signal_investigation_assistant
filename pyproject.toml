[project]
name = "dsi"
version = "0.1.0"
description = "Drug Safety Signal Investigation Assistant — agentic pharmacovigilance evidence assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Lower bounds are floors; uv.lock pins exact versions
# for reproducibility. Kept deliberately small (build-prompt: no infra beyond
# the stated stack without justification).
dependencies = [
    "pydantic>=2.7",          # typed schemas + structured-output validation
    "langgraph>=0.2",         # single-agent orchestration graph + resume
    "mcp>=1.2,<2",            # official MCP SDK — pinned to v1 (stable FastMCP API)
    "httpx>=0.27",            # HTTP client for tools (bounded timeouts/retries)
    "ollama>=0.3",            # local model client (also usable via httpx)
    "structlog>=24.1",        # structured JSON logging
    "psutil>=5.9",            # peak process memory metric (eval)
    "python-dotenv>=1.0",     # load .env (no secrets committed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",   # MCP tools are async
    "respx>=0.21",            # mock httpx in tool failure/empty/malformed tests
]

[project.scripts]
dsi = "dsi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
